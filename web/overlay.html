<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gorgon-overlay</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: transparent !important;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  color: #e0e0e0;
  overflow: hidden;
  user-select: none;
}
#app { padding: 8px; }
.overlay-session {
  background: rgba(0,0,0,0.5);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.overlay-session .dungeon { font-weight: 600; font-size: 15px; }
.overlay-session .timer { color: #7a7f8a; font-size: 13px; }
.overlay-session .badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}
.badge.running { background: #2ecc71; color: #000; }
.badge.stopped { background: #e67e22; color: #000; }
.badge.idle { background: #555; color: #ccc; }
.overlay-loot {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.loot-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 8px;
  background: rgba(0,0,0,0.3);
  border-radius: 4px;
  font-size: 13px;
  animation: fadeIn 0.3s;
  border-left: 3px solid transparent;
}
.loot-row.verdict-favor { border-left-color: #2ecc71; }
.loot-row.verdict-sell_vendor { border-left-color: #f39c12; }
.loot-row.verdict-sell_consignment { border-left-color: #9b59b6; }
.loot-row.verdict-keep { border-left-color: #7a7f8a; }
.loot-row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.loot-row .value { color: #f1c40f; font-weight:600; margin-left:8px; white-space:nowrap; }
.loot-row .verdict-label { font-size:11px; color:#7a7f8a; margin-left:8px; white-space:nowrap; }
.loot-count { color: var(--muted,#7a7f8a); font-size:12px; margin-bottom:4px; }
@keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
.empty { color: #555; font-size: 12px; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div id="app">
  <div class="overlay-session">
    <div><span class="dungeon" id="o-dungeon">—</span><span class="timer" id="o-timer"></span></div>
    <span class="badge idle" id="o-badge">idle</span>
  </div>
  <div class="loot-count" id="o-count"></div>
  <div class="overlay-loot" id="o-loot"></div>
</div>
<script>
const MAX_ITEMS = 50;
const LOOT = [];

function $(s) { return document.querySelector(s); }
function fmt(t) { const d=new Date(t); return d.toLocaleTimeString([],{hour12:false,hour:'2-digit',minute:'2-digit'}); }
function esc(s) { return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }

function fmtElapsed(ms) {
  const s=Math.floor((ms||0)/1000);
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h) return h+'h'+String(m).padStart(2,'0')+'m';
  if(m) return m+'m'+String(sec).padStart(2,'0')+'s';
  return sec+'s';
}

let sessionTimer = null;

function updateSession(session) {
  const d=$('#o-dungeon'), b=$('#o-badge'), t=$('#o-timer');
  if (!session || session.state === 'idle') {
    d.textContent = '—';
    b.textContent = 'idle'; b.className = 'badge idle';
    t.textContent = '';
    if (sessionTimer) { clearInterval(sessionTimer); sessionTimer=null; }
    return;
  }
  d.textContent = session.dungeon || 'unnamed';
  b.textContent = session.state;
  b.className = 'badge ' + session.state;
  if (session.state === 'running' && !sessionTimer) {
    const tick = () => { t.textContent = ' · ' + fmtElapsed(Date.now() - new Date(session.started_at).getTime()); };
    tick();
    sessionTimer = setInterval(tick, 1000);
  }
  if (session.state !== 'running' && sessionTimer) {
    clearInterval(sessionTimer); sessionTimer=null;
  }
}

function addLoot(loot) {
  LOOT.unshift(loot);
  if (LOOT.length > MAX_ITEMS) LOOT.length = MAX_ITEMS;
  renderLoot();
}

function renderLoot() {
  const container=$('#o-loot');
  if (!container) return;
  $('#o-count').textContent = LOOT.length + ' items';
  container.innerHTML = LOOT.map(l => {
    const v = l.verdict || (l.decision&&l.decision.verdict) || '';
    const val = l.value || l.valor || 0;
    return '<div class="loot-row verdict-' + v + '"><span class="name">' + esc(l.name) + '</span>' +
      '<span class="value">' + val.toFixed(0) + 'g</span>' +
      '<span class="verdict-label">' + esc(v.replace(/_/g,' ')) + '</span></div>';
  }).join('');
}

async function refreshSession() {
  try {
    const r = await fetch('/api/session');
    if (r.ok) {
      const s = await r.json();
      updateSession(s);
      if (s && s.loot) {
        for (const l of s.loot) addLoot(l);
      }
    }
  } catch {}
}
refreshSession();

const es = new EventSource('/api/feed');
es.onmessage = ev => {
  try {
    const data = JSON.parse(ev.data);
    if (data.kind === 'session_start' || data.kind === 'session_stop') refreshSession();
    if (data.kind === 'loot' && data.payload) addLoot(data.payload);
  } catch {}
};
</script>
</body>
</html>
